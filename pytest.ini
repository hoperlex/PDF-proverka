# Primary lane markers по §5 quality/runtime contract v1: КАЖДЫЙ test node несёт
# ровно один из unit/contract/integration/network/chaos. `slow` остаётся
# ортогональным атрибутом, а не lane.
#
# Регистрация здесь — часть ограниченного pre-G1 владения `W0-INT-01`
# (ADR-0006 §4.2). После G1 файл возвращается к `W1-INT-00`.
#
# `addopts` НЕ меняется вместе с регистрацией: выборка по умолчанию определяет,
# что сравнивается с baseline, и её смена — отдельный шаг с пересборкой
# baseline, а не побочный эффект появления маркеров.
[pytest]
testpaths = tests backend/tests
addopts = -p no:cacheprovider -m "not chaos"
norecursedirs = .git .pytest_cache .pytest_tmp .pytest_tmp2 .codex_test_tmp pytest-cache-files-* tmp_write_probe* tmp_write_probe2* tests/legacy
markers =
    unit: чистые domain/invariant/algorithm правила; только память, часы и random через fake (§5 quality/runtime contract v1)
    contract: schema/version/provider-consumer совместимость; temp files и bounded local compiler process, без сети и сервисов
    integration: совместная работа adapters/компонентов, изолированная ФС, потоки, локальные сервисы; loopback для service-backed
    network: реальный HTTP/gRPC/socket/process lifecycle; loopback, дочерние процессы, свободные порты
    slow: поднимает НАСТОЯЩИЕ процессы (uvicorn, агент, исполнитель); секунды, не миллисекунды. Запускается по умолчанию; отключить — `-m "not slow"`.
    chaos: УБИВАЕТ и перезапускает настоящие процессы (SIGTERM/SIGKILL шлюзу); исход зависит от таймингов раннера, поэтому в основной набор не берётся. Из прогона по умолчанию ИСКЛЮЧЁН (`addopts = -m "not chaos"`), гоняется отдельным job'ом — `python -m pytest tests/test_process_chaos_12e.py -m chaos`.
