# CI по контракту `quality-runtime/v1`.
#
# СТАТУС: regression gate остаётся observe-first — `continue-on-error` НЕ снят.
# Причин по-прежнему две, но вторая уменьшилась, а не исчезла:
#   1) не назван источник `norms/vault` (внешний вход владельца программы);
#   2) полоса `network` ещё НЕ детерминирована целиком. Волна 0.0.03 закрыла
#      три обязательных теста настоящих процессов с названным механизмом и
#      контрольным опытом, но в полосе остаётся узел NB-1
#      (test_agent_gateway_12b::test_r_u_scheduler_atomic_offer_and_lost_delivery_recovery),
#      падавший 1 раз на 4 прогона. Пока он не разобран, полоса не может стать
#      блокирующей: «три теста вылечены» и «полоса детерминирована» — разные
#      утверждения, и подменять одно другим нельзя.
# Подробности и порядок включения — в разделе «Условия перевода в enforce» в
# конце файла.
#
# Что даёт этот workflow сверх прежнего:
#   - установка одной воспроизводимой командой с lock-профилем `qr-v1`;
#   - capability probe ДО тестов: непригодное окружение отказывает сразу и
#     называет причину, а не даёт «странные» падения через десять минут;
#   - пять lane-job'ов по §5.1, каждый со своими бюджетами §7 и своим JUnit;
#   - JSON receipt §8 на каждый прогон, все отчёты выгружаются артефактами;
#   - provisioning norm corpus отдельным проверяемым шагом.
#
# Контракт окружения — docs/architecture/QUALITY_RUNTIME_CONTRACT_V1.md.
# Эксплуатация — docs/ops/TEST_HARNESS_RUNBOOK.md.
#
# Владение файлом: `W0-INT-01` по ограниченному pre-G1 исключению
# (ADR-0006 §4.2). После G1 файл возвращается к `W1-OPS-02`.

name: tests

on:
  push:
  pull_request:

# §3.1: значения профиля задаются один раз и наследуются всеми job'ами.
# Раньше их приходилось повторять в каждом шаге, и они успели разойтись.
env:
  PYTHON_VERSION: "3.12.3"
  NODE_VERSION: "22.23.1"
  AUDIT_DISABLE_DOTENV: "1"
  PAID_API_ENABLED: "false"
  PORTAL_AUTH_ENABLED: "false"
  TZ: UTC
  LC_ALL: "C.UTF-8"
  # §8 требует source_commit в каждом receipt. В Actions provenance даёт
  # сам checkout, но объявляем явно: в дереве без `.git` (например
  # развёрнутом из архива) probe иначе откажется выпускать расписку.
  QR_SOURCE_COMMIT: ${{ github.sha }}
  PYTHONHASHSEED: "0"

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Пять lane-job'ов по §5.1. Каждый со своим бюджетом, своим JUnit и своим
  # receipt. Разделены не ради красоты: §7 задаёт РАЗНЫЕ бюджеты на lane, а
  # общий прогон свёл бы их к худшему.
  # ───────────────────────────────────────────────────────────────────────────
  lanes:
    name: "lane ${{ matrix.lane }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false        # один упавший lane не скрывает состояние прочих
      matrix:
        lane: [unit, contract, integration, network]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # §3.1 — один профиль на весь прогон. check_profile_pins в --enforce
      # требует пины Node/npm ДАЖЕ в python-полосах: контракт описывает машину
      # целиком, а не только её питоновскую половину.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Установка ОДНОЙ командой с lock-профилем. Прежняя схема «шесть -r
      # подряд плюс ad-hoc pip install pytest» не воспроизводила frozen
      # receipt §4.1: часть версий приезжала из манифеста стороннего VPS.
      # Без `|| true`: молча пропущенная зависимость даёт падения,
      # неотличимые от регрессий.
      - name: Установить зависимости профиля qr-v1
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-qr-v1.txt -r requirements-dev.txt

      # Здесь только отпечаток в лог и связность набора. Сверку с §4.1
      # делает probe внутри `ci_test_lane.py` (PIP_FREEZE_DRIFT); она не
      # дублируется, чтобы рецепт оставался в одном месте.
      - name: Отпечаток набора зависимостей и `pip check`
        run: |
          echo "pip freeze sha256: $(python -m pip freeze | sha256sum | cut -d' ' -f1)"
          python -m pip check

      # Источник корпуса задаётся ТОЛЬКО конфигурацией репозитория, адрес в
      # workflow не зашит: зашитый источник — неотзываемое доверие. Форма
      # приёмки и смысл каждой переменной — docs/ops/NORM_ARTIFACT_SOURCE.md.
      #
      # Пока владелец источник не назвал, ни одна переменная не задана, и шаг
      # ведёт себя ровно как прежде: OPTIONAL_NORM_CORPUS_ABSENT и exit 0.
      # Как только источник задан, `--enforce-if-configured` делает шаг
      # fail-closed: недоступность, несовпадение SHA-256 или отсутствие
      # эталона — setup failure, а не warning и не skip.
      - name: Provisioning norm corpus
        env:
          QR_NORM_ARTIFACT_SOURCE_ID: ${{ vars.QR_NORM_ARTIFACT_SOURCE_ID }}
          QR_NORM_ARTIFACT_URL: ${{ vars.QR_NORM_ARTIFACT_URL }}
          QR_NORM_ARTIFACT_VERSION: ${{ vars.QR_NORM_ARTIFACT_VERSION }}
          QR_NORM_ARTIFACT_SHA256: ${{ vars.QR_NORM_ARTIFACT_SHA256 }}
          # Секрет виден ТОЛЬКО этому шагу: в env job'а он попал бы в окружение
          # pytest, а §3.1 требует прогон без provider credentials.
          QR_NORM_ARTIFACT_TOKEN: ${{ secrets.QR_NORM_ARTIFACT_TOKEN }}
        run: >-
          python scripts/ci_provision_norms.py
          --acquire --build-index --enforce-if-configured --json

      # §3.1: uid != 0. Под root режимы 0o555 не действуют, и проверки
      # неудаляемости запечатанного дерева проходят вхолостую.
      - name: Проверить, что прогон не под root
        run: test "$(id -u)" -ne 0 || { echo "::error::раннер под root — нарушение §3.1"; exit 1; }

      # Раннер сам выполняет probe ДО pytest (§6, правило 1): отсутствие
      # обязательной capability — setup failure, а не skip.
      # Пока baseline не расчищен, ПАДЕНИЯ ТЕСТОВ здесь не блокируют: 2 записи в
      # unit и 33 ошибки в integration — известный долг, и без сравнения с
      # baseline (его делает job regression-gate) полоса была бы красной на
      # каждом прогоне, что противоречит объявленному здесь observe-first.
      # Снимается вместе с continue-on-error у регресс-гейта, шагом 4 порядка
      # включения в конце файла.
      #
      # Блокирующими остаются шаги ВЫШЕ: установка по constraints, pip check,
      # provisioning, проверка uid != 0. Отказ инфраструктуры — не наблюдение,
      # и пропускать его нельзя ни при каком состоянии baseline.
      # НЕ `continue-on-error` на весь шаг: он глушил и код 2 (probe не пропустил
      # lane — отсутствует loopback/process capability), и код 4 (испорченный
      # JUnit), и код 5 (пустая выборка). Наблюдать полагается ТОЛЬКО падения
      # тестов; непригодный прогон обязан быть красным, иначе «зелёный CI»
      # начинает означать «мы ничего не проверили».
      - name: "Lane ${{ matrix.lane }}"
        env:
          AUDIT_APP_DATA_DIR: ${{ runner.temp }}/run-root/app_data
          AUDIT_PROJECTS_DIR: ${{ runner.temp }}/run-root/projects
          AUDIT_OBJECTS_FILE: ${{ runner.temp }}/run-root/objects.json
          AUDIT_ACTION_LOG_DIR: ${{ runner.temp }}/run-root/action_log
          AUDITMANAGER_DEPLOY_LOCK_DIR: ${{ runner.temp }}/run-root/locks
        run: |
          set +e
          python scripts/ci_test_lane.py --lane ${{ matrix.lane }} --use-lane-marker --ci
          rc=$?
          set -e
          # 0 — чисто, 1 — тесты упали (наблюдаем, пока baseline не расчищен).
          # 2 setup failure, 3 бюджет §7, 4 негодный отчёт, 5 пустая выборка —
          # всё это прогон, из которого нельзя делать выводов.
          if [ "$rc" -le 1 ]; then exit 0; fi
          echo "::error::ci_test_lane вернул $rc — прогон непригоден (не падение теста)"
          exit "$rc"

      # Отчёты выгружаются ВСЕГДА: при падении они нужнее всего. §8 требует
      # свежий JUnit и JSON receipt на каждый прогон.
      - name: Выгрузить отчёты lane
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-${{ matrix.lane }}-reports
          path: .ci/reports/
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Legacy aggregate против baseline. Остаётся до тех пор, пока lane-receipt'ы
  # не станут единственным источником вердикта: он сравнивает с известным
  # долгом, а lanes этого не делают.
  # ───────────────────────────────────────────────────────────────────────────
  regression-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # §3.1 — один профиль на весь прогон. check_profile_pins в --enforce
      # требует пины Node/npm ДАЖЕ в python-полосах: контракт описывает машину
      # целиком, а не только её питоновскую половину.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Установить зависимости профиля qr-v1
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-qr-v1.txt -r requirements-dev.txt

      - name: Связность набора зависимостей (`pip check`)
        run: python -m pip check

      # Решение C-2: нормативный контур проверяется, а не пропускается.
      # Корпус лежит вне git и обязан приезжать с checksum.
      #
      # ОЖИДАЕТ ВЛАДЕЛЬЦА: источник не назван. Ветвление идёт по КОНФИГУРАЦИИ,
      # а не по наличию каталога. Прежняя ветка `if [ -d norms/vault ]` была
      # маскировкой сразу дважды: во-первых, отсутствие обязательного входа она
      # понижала до `::warning::`, то есть до зелёного job'а; во-вторых, любой
      # каталог `norms/vault`, взявшийся на раннере откуда угодно, она молча
      # принимала за корпус. Теперь оба состояния названы:
      #   источник не задан  → OPTIONAL_NORM_CORPUS_ABSENT, exit 0 (как прежде);
      #   источник задан     → fail-closed, любой сбой получения = setup failure.
      #
      # norms/tools/README.md прямо запрещает собирать корпус из norms_db.json,
      # поэтому внутри репозитория его получить нельзя: это внешний вход.
      # Что обязан предоставить владелец — docs/ops/NORM_ARTIFACT_SOURCE.md.
      - name: Provisioning norm corpus
        env:
          QR_NORM_ARTIFACT_SOURCE_ID: ${{ vars.QR_NORM_ARTIFACT_SOURCE_ID }}
          QR_NORM_ARTIFACT_URL: ${{ vars.QR_NORM_ARTIFACT_URL }}
          QR_NORM_ARTIFACT_VERSION: ${{ vars.QR_NORM_ARTIFACT_VERSION }}
          QR_NORM_ARTIFACT_SHA256: ${{ vars.QR_NORM_ARTIFACT_SHA256 }}
          QR_NORM_ARTIFACT_TOKEN: ${{ secrets.QR_NORM_ARTIFACT_TOKEN }}
        run: >-
          python scripts/ci_provision_norms.py
          --acquire --build-index --enforce-if-configured --json

      - name: Проверить, что прогон не под root
        run: test "$(id -u)" -ne 0 || { echo "::error::раннер под root — нарушение §3.1"; exit 1; }

      - name: Capability preflight
        run: python scripts/ci_runtime_probe.py --profile unit

      # Гейт ограничен по времени (находка OPS03-F10): на машине с зависающим
      # тестом он отказывает с диагнозом, а не висит до таймаута job'а.
      - name: Регресс-гейт (падает только на НОВЫХ падениях против baseline)
        continue-on-error: true
        env:
          CI_GATE_WALL_BUDGET_SEC: "1800"
          AUDIT_PROJECTS_DIR: ${{ runner.temp }}/run-root/projects
          AUDIT_OBJECTS_FILE: ${{ runner.temp }}/run-root/objects.json
          AUDIT_ACTION_LOG_DIR: ${{ runner.temp }}/run-root/action_log
          AUDITMANAGER_DEPLOY_LOCK_DIR: ${{ runner.temp }}/run-root/locks
        run: python scripts/ci_regression_gate.py

      - name: Выгрузить отчёт гейта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-report
          path: .ci_last_report.xml
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend gate §10. Node пинится явно: полагаться на PATH раннера нельзя —
  # ровно на этом clean-room репетиция получила node 18 вместо 22 (CR-5).
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, а не `npm install`: ci ставит РОВНО lockfile и падает при
      # расхождении с package.json, install молча правит lockfile.
      - name: Установить зависимости
        run: npm ci

      - name: Версии инструментов
        run: |
          echo "node $(node -v), npm $(npm -v)"
          test "$(node -v)" = "v${{ env.NODE_VERSION }}" \
            || { echo "::error::Node не соответствует пину §3.1"; exit 1; }

      - name: Тесты
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Strict typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ───────────────────────────────────────────────────────────────────────────
  # Решение C-5: chaos поднимает реальные процессы, убивает их сигналами и
  # зависит от таймингов раннера. Отдельный observe-only job — его назначение
  # видеть недетерминизм, а не блокировать merge.
  # ───────────────────────────────────────────────────────────────────────────
  chaos:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # §3.1 — один профиль на весь прогон. check_profile_pins в --enforce
      # требует пины Node/npm ДАЖЕ в python-полосах: контракт описывает машину
      # целиком, а не только её питоновскую половину.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Установить зависимости профиля qr-v1
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints-qr-v1.txt -r requirements-dev.txt

      - name: Проверить, что прогон не под root
        run: test "$(id -u)" -ne 0 || { echo "::error::раннер под root — нарушение §3.1"; exit 1; }

      - name: Chaos lane
        env:
          AUDIT_APP_DATA_DIR: ${{ runner.temp }}/run-root/app_data
          AUDIT_PROJECTS_DIR: ${{ runner.temp }}/run-root/projects
          AUDIT_OBJECTS_FILE: ${{ runner.temp }}/run-root/objects.json
          AUDIT_ACTION_LOG_DIR: ${{ runner.temp }}/run-root/action_log
          AUDITMANAGER_DEPLOY_LOCK_DIR: ${{ runner.temp }}/run-root/locks
        run: python scripts/ci_test_lane.py --lane chaos --use-lane-marker --ci

      - name: Выгрузить отчёты chaos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-chaos-reports
          path: .ci/reports/
          if-no-files-found: warn

# ─── Условия перевода гейта в enforce ────────────────────────────────────────
#
# Выполнено:
#   ✔ установка воспроизводима: один lock-профиль, `pip check` зелёный,
#     `pip freeze` совпадает с frozen receipt §4.1;
#   ✔ прогон не под root, изоляция состояния по §3.2 включая lock-каталог;
#   ✔ capability probe выполняется ДО тестов в режиме --ci (§6 правило 1: в
#     CI-полосе послаблений §6.2 нет, профильные проверки §3 обязательны),
#     и его отказ
#     КРАСИТ job: наблюдается только код 1 (упали тесты), а 2/3/4/5 —
#     непригодный прогон — пробрасываются наружу;
#   ✔ пины §3.1 заданы точно: Python 3.12.3 (не 3.12), Node/npm во ВСЕХ
#     job'ах (check_profile_pins требует их и в python-полосах), TZ, LC_ALL,
#     PYTHONHASHSEED;
#   ✔ пять lanes с бюджетами §7, JUnit и JSON receipt §8, отчёты выгружаются;
#   ✔ гейт ограничен по времени и не может висеть бесконечно;
#   ✔ frontend gate с пиннингом Node и strict typecheck;
#   ✔ у каждой записи baseline есть владелец, задача закрытия и срок.
#
# Частично закрыто волной 0.0.03:
#   ◐ три обязательных теста настоящих процессов детерминированы. Причина
#     названа механизмом, а не «взаимным влиянием»: тесты синхронизировались не
#     на том факте, который проверяли, и читали телеметрию ЖИВОГО хоста.
#     Политика ёмкости воркера берёт её из ДВУХ источников — psutil (RAM/своп)
#     и stdlib `os` (`getloadavg`/`cpu_count`), — а изолирован был только
#     первый. `s_la` считается как LA5 на ядро и при значении >= 1.0 срезает
#     ёмкость до `configured_max - 1`, при >= 1.5 — до нуля; гистерезис роста
#     удерживает заниженное значение дольше ожидания теста. На занятой машине
#     «два одновременных процесса» не наступали никогда — центр честно не
#     выдавал второе задание. Исправлено в тестах; production-кода не тронуто
#     ни строки, ни один порог не ослаблен, ни одного skip/xfail не добавлено.
#     Доказательство — docs/architecture/receipts/W0-INT-01-network-determinism.json
#     (контрольный опыт на одном стенде под одной нагрузкой: до правки 8
#     красных прогонов из 8, после — 8 зелёных из 8; выборка полосы не
#     изменилась, значит ничего не спрятано).
#
#     Это НЕ означает, что полоса детерминирована: см. условие 2 ниже.
#
# НЕ выполнено — два оставшихся условия:
#   ✘ полоса `network` содержит неразобранный недетерминированный узел NB-1:
#     tests/test_agent_gateway_12b.py::test_r_u_scheduler_atomic_offer_and_lost_delivery_recovery.
#     Измерено: 1 падение на 4 полных прогона полосы. Механизм того же класса —
#     тест вычитывает job_offer ИЗ ПОТОКА и сразу требует, чтобы в базе шлюза
#     уже стояла отметка `delivered_at`, тогда как production сначала кладёт
#     ответ в outbound queue и фиксирует доставку следующим `await`. Порядок в
#     production правильный: пометить доставленным не отправленный offer было
#     бы хуже. Чинится тест — bounded-ожиданием самой отметки.
#
#   ✘ источник norms/vault не назван владельцем. §6 правило 4 контракта
#     объявляет корпус обязательным для enforce, а norms/tools/README.md
#     запрещает собирать его из norms_db.json — это внешний вход, и получить
#     его внутри репозитория нельзя. Пока источника нет, `--enforce` дал бы
#     NORM_ARTIFACT_MISSING на КАЖДОМ прогоне каждой полосы (severity_for в
#     ci_runtime_probe.py привязывает обязательность корпуса именно к enforce).
#
#     ВНИМАНИЕ, прежняя запись здесь была неверна. Она утверждала, что 33 из
#     35 записей baseline существуют только из-за отсутствующего корпуса и
#     после provisioning исчезнут. Волна 0.0.03 это проверила и опровергла:
#     все 33 узла падают на setup фикстуры с AttributeError, потому что тест
#     монкейпатчит у norms.external_provider атрибуты, которых у модуля не
#     было никогда (`git log -S NORMS_VAULT_PATH` по файлу пуст). Появление
#     корпуса не изменит ни одного из этих исходов. Разбор и владелец —
#     в шапке scripts/ci_known_failures.txt.
#
# Порядок включения, когда источник появится:
#   1. задать источник конфигурацией репозитория — variables
#      QR_NORM_ARTIFACT_SOURCE_ID / _URL / _VERSION / _SHA256 и, для закрытого
#      источника, secret QR_NORM_ARTIFACT_TOKEN. Правка workflow для этого НЕ
#      нужна: шаг «Provisioning norm corpus» уже source-agnostic и с первой же
#      заданной переменной становится fail-closed. Форма приёмки и порядок
#      проверки на свежем раннере — docs/ops/NORM_ARTIFACT_SOURCE.md;
#   2. по JUnit подтвердить судьбу КАЖДОЙ записи baseline поимённо. Ожидать
#      исчезновения группы 1 от одного лишь provisioning нельзя — её причина
#      другая (см. выше и шапку ci_known_failures.txt). Отдельно требуется
#      закрытие задачи владельца нормативного контура;
#   3. пересобрать baseline ОДИН раз в этом окружении и закоммитить с
#      обоснованием (`ci_regression_gate.py --record`; он сам откажет, пока
#      корпус не provisioned);
#   4. заменить `--ci` на `--enforce` у шагов Lane и Chaos: §3.3 и §6
#      правило 4 привязывают обязательность norm corpus именно к enforce,
#      поэтому раньше появления источника это дало бы NORM_ARTIFACT_MISSING
#      на каждом прогоне — измерено в чистой комнате;
#   5. снять `continue-on-error: true` у шага «Регресс-гейт» и убрать у шага
#      «Lane <lane>» ветку, которая гасит код 1. `continue-on-error` там
#      уже НЕ стоит: шаг разбирает код возврата и наблюдает только
#      падения тестов, пробрасывая 2/3/4/5. Снять надо именно маскировку
#      кода 1 — тогда падение теста снова красит job;
#   6. до перевода полосы `network` в блокирующую — разобрать
